version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopcart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopcart
      POSTGRES_USER: shopcart_user
      POSTGRES_PASSWORD: shopcart_pass
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  pgdata:
